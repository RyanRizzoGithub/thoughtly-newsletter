<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to Thoughtly</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  /* ── Brand tokens ── */
  :root {
    --parchment: #F8F7F4;
    --forest: #3D403C;
    --forest-70: rgba(61, 64, 60, 0.70);
    --forest-50: rgba(61, 64, 60, 0.50);
    --slate: #7485A4;
    --sand: #E9DAC1;
    --sand-soft: #F1E8D9;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: 'DM Sans', Poppins, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --gutter: 20px;
    --measure: 640px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--parchment);
    color: var(--forest);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .tly-wrap {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 24px var(--gutter) calc(48px + env(safe-area-inset-bottom));
  }

  /* ── List view ── */
  .tly-head { margin-bottom: 20px; }
  .tly-eyebrow {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 6px;
  }
  .tly-head h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 30px;
    line-height: 1.2;
    margin: 0;
  }

  .tly-search {
    width: 100%;
    margin: 18px 0 8px;
    padding: 12px 14px;
    font: inherit;
    font-size: 15px;
    color: var(--forest);
    background: #fff;
    border: 1px solid var(--sand);
    border-radius: 5px;
    outline: none;
    -webkit-appearance: none;
  }
  .tly-search:focus { border-color: var(--slate); }
  .tly-search::placeholder { color: var(--forest-50); }

  .tly-list { list-style: none; margin: 0; padding: 0; }
  .tly-item { border-bottom: 1px solid var(--sand); }
  .tly-item button {
    all: unset;
    display: block;
    width: 100%;
    padding: 20px 0;
    cursor: pointer;
  }
  .tly-item button:focus-visible { outline: 2px solid var(--slate); outline-offset: 4px; }
  .tly-item h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 21px;
    line-height: 1.3;
    margin: 0 0 6px;
    color: var(--forest);
  }
  .tly-item p {
    margin: 0 0 8px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--forest-70);
  }
  .tly-meta {
    font-size: 13px;
    color: var(--slate);
  }

  .tly-more {
    display: block;
    margin: 24px auto 0;
    padding: 11px 22px;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--forest);
    background: transparent;
    border: 1px solid var(--forest);
    border-radius: 5px;
    cursor: pointer;
  }

  .tly-state {
    padding: 48px 0;
    text-align: center;
    color: var(--forest-50);
    font-size: 14px;
  }

  /* ── Reading view ── */
  .tly-back {
    all: unset;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--slate);
    cursor: pointer;
    padding: 4px 0;
    margin-bottom: 20px;
  }
  .tly-back svg { width: 16px; height: 16px; }

  .tly-article h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 30px;
    line-height: 1.2;
    margin: 0 0 10px;
  }
  .tly-article .tly-meta { display: block; margin-bottom: 22px; }
  .tly-rule { border: 0; border-top: 1px solid var(--sand); margin: 0 0 24px; }

  .tly-body { font-size: 17px; line-height: 1.7; }
  .tly-body p { margin: 0 0 1.1em; }
  .tly-body h2, .tly-body h3, .tly-body h4 {
    font-family: var(--serif);
    font-weight: 400;
    line-height: 1.3;
    margin: 1.6em 0 0.6em;
  }
  .tly-body h2 { font-size: 23px; }
  .tly-body h3 { font-size: 20px; }
  .tly-body a { color: var(--slate); text-underline-offset: 2px; }
  .tly-body img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 1.4em auto; }
  .tly-body blockquote {
    margin: 1.4em 0;
    padding: 4px 0 4px 18px;
    border-left: 3px solid var(--sand);
    font-family: var(--serif);
    font-style: italic;
    color: var(--forest-70);
  }
  .tly-body ul, .tly-body ol { padding-left: 1.3em; margin: 0 0 1.1em; }
  .tly-body li { margin-bottom: 0.4em; }
  .tly-body hr { border: 0; border-top: 1px solid var(--sand); margin: 2em 0; }

  .tly-next {
    margin-top: 40px;
    padding-top: 22px;
    border-top: 1px solid var(--sand);
  }
  .tly-next .tly-eyebrow { margin-bottom: 4px; }
  .tly-next button {
    all: unset;
    cursor: pointer;
    font-family: var(--serif);
    font-size: 20px;
    line-height: 1.3;
    color: var(--forest);
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<main class="tly-wrap">

  <!-- ── LIST VIEW ── -->
  <section id="tly-list-view">
    <header class="tly-head">
      <span class="tly-eyebrow">Newsletter</span>
      <h1>Welcome to Thoughtly</h1>
    </header>
    <input id="tly-search" class="tly-search" type="search" placeholder="Search issues" aria-label="Search issues" autocomplete="off">
    <ul id="tly-list" class="tly-list"></ul>
    <div id="tly-list-state" class="tly-state">Loading...</div>
    <button id="tly-more" class="tly-more" type="button" hidden>Show more</button>
  </section>

  <!-- ── READING VIEW ── -->
  <section id="tly-read-view" hidden>
    <button id="tly-back" class="tly-back" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
      All issues
    </button>
    <article class="tly-article">
      <h1 id="tly-title"></h1>
      <span id="tly-meta" class="tly-meta"></span>
      <hr class="tly-rule">
      <div id="tly-body" class="tly-body"></div>
    </article>
    <div id="tly-next" class="tly-next" hidden>
      <span class="tly-eyebrow">Next issue</span>
      <button id="tly-next-btn" type="button"></button>
    </div>
  </section>

</main>

<script>
(function () {
  var DATA_URL = 'data/posts.json';
  var PAGE_SIZE = 15;

  var posts = [];
  var filtered = [];
  var shown = PAGE_SIZE;
  var listScroll = 0;

  var $ = function (id) { return document.getElementById(id); };
  var listView = $('tly-list-view'), readView = $('tly-read-view');
  var list = $('tly-list'), state = $('tly-list-state'), more = $('tly-more');
  var search = $('tly-search');

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function meta(p) {
    var parts = [fmtDate(p.date)];
    if (p.minutes) parts.push(p.minutes + ' min read');
    return parts.filter(Boolean).join(' · ');
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ── List ── */
  function renderList() {
    var slice = filtered.slice(0, shown);
    list.innerHTML = slice.map(function (p) {
      return '<li class="tly-item"><button type="button" data-slug="' + esc(p.slug) + '">' +
        '<h2>' + esc(p.title) + '</h2>' +
        '<p>' + esc(p.excerpt) + '</p>' +
        '<span class="tly-meta">' + esc(meta(p)) + '</span>' +
        '</button></li>';
    }).join('');
    state.hidden = filtered.length > 0;
    if (!filtered.length) state.textContent = posts.length ? 'No issues match that search.' : 'No issues yet.';
    more.hidden = shown >= filtered.length;
  }

  function applySearch() {
    var q = search.value.trim().toLowerCase();
    filtered = !q ? posts : posts.filter(function (p) {
      return (p.title + ' ' + p.excerpt + ' ' + p.html.replace(/<[^>]+>/g, ' ')).toLowerCase().indexOf(q) !== -1;
    });
    shown = PAGE_SIZE;
    renderList();
  }

  list.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-slug]');
    if (btn) location.hash = '#/' + btn.getAttribute('data-slug');
  });
  more.addEventListener('click', function () { shown += PAGE_SIZE; renderList(); });
  search.addEventListener('input', applySearch);

  /* ── Reading ── */
  function openPost(slug) {
    var i = posts.findIndex(function (p) { return p.slug === slug; });
    if (i === -1) { showList(); return; }
    var p = posts[i];

    $('tly-title').textContent = p.title;
    $('tly-meta').textContent = meta(p);
    var body = $('tly-body');
    body.innerHTML = p.html;
    body.querySelectorAll('a[href]').forEach(function (a) {
      a.target = '_blank';
      a.rel = 'noopener';
    });

    var next = posts[i + 1]; // posts are newest first, so "next" is the older issue
    $('tly-next').hidden = !next;
    if (next) {
      $('tly-next-btn').textContent = next.title;
      $('tly-next-btn').onclick = function () { location.hash = '#/' + next.slug; };
    }

    if (!listView.hidden) listScroll = window.scrollY;
    listView.hidden = true;
    readView.hidden = false;
    window.scrollTo(0, 0);
    document.title = p.title + ' | Thoughtly';
  }

  function showList() {
    readView.hidden = true;
    listView.hidden = false;
    window.scrollTo(0, listScroll);
    document.title = 'Welcome to Thoughtly';
  }

  $('tly-back').addEventListener('click', function () {
    location.hash = '';
  });

  function route() {
    var m = location.hash.match(/^#\/(.+)$/);
    if (m) openPost(decodeURIComponent(m[1]));
    else showList();
  }
  window.addEventListener('hashchange', route);

  /* ── Load ── */
  fetch(DATA_URL, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      posts = data.posts || [];
      filtered = posts;
      renderList();
      route();
    })
    .catch(function () {
      state.textContent = 'The newsletter could not load. Please try again in a moment.';
    });
})();
</script>
</body>
</html>
